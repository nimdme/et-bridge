name: Deployments

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  register-deployment:
    name: Record Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Pages build
        run: sleep 20

      - name: Register GitHub Deployment Status
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'Production',
              auto_merge: false,
              required_contexts: [],
              description: 'Cloudflare Pages deployment'
            });

            if (deployment.data && deployment.data.id) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.data.id,
                state: 'success',
                environment_url: 'https://etbridge.pages.dev',
                auto_inactive: true,
                description: 'Deployed successfully to Cloudflare Pages'
              });
            }
