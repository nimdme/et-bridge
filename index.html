            "mainEntity": [
              {
                "@type": "Question",
                "name": "How do I log into ETLab with ETBridge?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Enter your college institute code (for example: gcek for Kannur, mace for Kothamangalam, rit for Kottayam) along with your regular ETLab admission number or username and password. The authentication request is made directly to ETLab without any middleman proxy."
                }
              },
              {
                "@type": "Question",
                "name": "Is my password or student data stored on any server?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. ETBridge is a 100% static client-side application. There are no intermediate servers, databases, or tracking proxies. All API requests go directly from your browser to ETLab's official API (api.students.etlab.app), and your authentication token is kept only in your browser's local storage."
                }
              },
              {
                "@type": "Question",
                "name": "How does the 75% attendance bunk calculator work?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "The calculation uses the standard university attendance target of 75%. If your attendance is currently at or above 75%, it calculates how many classes you can skip without dropping below 75%. If your attendance is below 75%, it calculates how many consecutive hours you must attend to cross the 75% threshold."
                }
              },
              {
                "@type": "Question",
                "name": "How does self-reported duty leave work?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Faculty often take several days or weeks to enter approved duty leaves into the ETLab portal. ETBridge lets you toggle the specific hours you were on duty (e.g. Hours 4, 5, 6) to project your true attendance and bunk margins. It clearly labels these as self-reported, and automatically reconciles once faculty inputs the official approval."
                }
              },
              {
                "@type": "Question",
                "name": "Which colleges are supported by ETBridge?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Any university or college that uses ETLab's student portal (including GCEK, MACE, TKMCE, JEC, VJEC, RIT, GECK, CET, MEC, and others across Kerala Technological University)."
                }
              }
            ]
          }
